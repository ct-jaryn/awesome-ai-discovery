name: Check links

# Manual only. The push, pull_request and weekly Monday 06:00 UTC triggers
# were removed on 2026-11-20, so links are checked only when someone starts
# this workflow. Note that GitHub also disabled this workflow for repository
# inactivity; re-enable it on the Actions tab before relying on it. Start it
# with: gh workflow run linkcheck.yml --ref main
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in README
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200..=299,403,429
            --max-retries 3
            --timeout 20
            README.md
          fail: true

      - name: Open issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead links found in README
          content-filepath: ./lychee/out.md
          labels: link-rot
